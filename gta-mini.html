<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA Mini City</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
overflow:hidden
}

h1{margin:10px 0 3px;font-size:26px}
p{margin:0 0 7px;color:#aaa}

#start{
padding:10px 25px;
border:0;
border-radius:20px;
background:#e63946;
color:white;
font-weight:bold;
margin-bottom:8px
}

#game{
position:relative;
width:96vw;
height:78vh;
min-height:520px;
margin:auto;
overflow:hidden;
border:3px solid #333;
border-radius:15px;
background:#5d9145;
box-shadow:0 0 30px #000
}

/* ROAD SYSTEM */
.road{
position:absolute;
background:#383838;
z-index:1
}

.road.h1{
left:0;
top:38%;
width:100%;
height:105px
}

.road.h2{
left:0;
top:68%;
width:100%;
height:95px
}

.road.v1{
top:0;
left:29%;
width:105px;
height:100%
}

.road.v2{
top:0;
left:68%;
width:105px;
height:100%
}

/* ROAD LINES */
.line{
position:absolute;
z-index:2;
background:#f6d365
}

.hline{
height:4px;
width:100%;
background:repeating-linear-gradient(
90deg,
#f6d365 0 35px,
transparent 35px 65px
)
}

.vline{
width:4px;
height:100%;
background:repeating-linear-gradient(
0deg,
#f6d365 0 35px,
transparent 35px 65px
)
}

.hl1{top:40%}
.hl2{top:70%}
.vl1{left:31%}
.vl2{left:70%}

/* BUILDINGS */
.building{
position:absolute;
z-index:5;
border:4px solid #252525;
border-radius:8px;
box-shadow:5px 6px 12px #0008;
overflow:hidden
}

.building:before{
content:"";
position:absolute;
inset:10px;
background:
repeating-linear-gradient(
90deg,
#ffd85c 0 18px,
transparent 18px 35px
),
repeating-linear-gradient(
0deg,
transparent 0 20px,
#ffd85c 20px 30px
);
opacity:.65
}

.b1{left:3%;top:4%;width:21%;height:27%;background:#8e6f5a}
.b2{right:3%;top:5%;width:25%;height:26%;background:#5f7185}
.b3{left:3%;top:47%;width:20%;height:15%;background:#86644e}
.b4{right:3%;top:47%;width:24%;height:15%;background:#766a86}
.b5{left:3%;bottom:4%;width:22%;height:20%;background:#657b68}
.b6{right:3%;bottom:4%;width:23%;height:20%;background:#896b55}

/* SHOPS */
.shop{
position:absolute;
z-index:7;
padding:8px 12px;
background:#d62828;
border:3px solid #222;
border-radius:6px;
font-size:12px;
font-weight:bold;
box-shadow:0 3px 7px #000
}

.shop1{left:35%;top:25%}
.shop2{left:73%;top:31%;background:#168aad}
.shop3{left:34%;top:73%;background:#f77f00}

/* PARK */
#park{
position:absolute;
left:42%;
top:4%;
width:22%;
height:27%;
background:#3f8f45;
border:4px solid #28642d;
border-radius:12px;
z-index:3
}

.tree{
position:absolute;
width:25px;
height:25px;
background:#14532d;
border-radius:50%;
box-shadow:0 4px 0 #713f12
}

.t1{left:15%;top:15%}
.t2{right:15%;top:25%}
.t3{left:30%;bottom:15%}
.t4{right:30%;bottom:10%}

/* PETROL PUMP */
#petrol{
position:absolute;
right:34%;
bottom:5%;
width:14%;
height:14%;
background:#e9ecef;
border:4px solid #222;
border-radius:8px;
z-index:7;
font-size:12px;
font-weight:bold;
color:#111;
padding-top:12px
}

#petrol:after{
content:"⛽";
font-size:25px;
display:block
}

/* CARS */
.car{
position:absolute;
width:45px;
height:68px;
border-radius:9px;
border:3px solid #181818;
z-index:10;
box-shadow:0 4px 8px #0009
}

.car:before{
content:"";
position:absolute;
left:7px;
top:10px;
width:25px;
height:19px;
background:#a9d9e8;
border-radius:5px;
border:2px solid #444
}

.car:after{
content:"";
position:absolute;
left:5px;
bottom:8px;
width:29px;
height:8px;
background:#181818;
border-radius:5px
}

.red{background:#d62828}
.blue{background:#1976d2}
.yellow{background:#e0a800}
.green{background:#18854b}

/* PLAYER */
#player{
position:absolute;
width:29px;
height:40px;
left:50%;
top:55%;
transform:translate(-50%,-50%);
background:#2196f3;
border:3px solid white;
border-radius:8px;
z-index:25;
box-shadow:0 0 14px #2196f3
}

#player:before{
content:"";
position:absolute;
width:12px;
height:12px;
background:#ffd9b3;
border-radius:50%;
left:6px;
top:-10px
}

/* HUD */
#hud{
position:absolute;
top:10px;
left:10px;
z-index:50;
background:#000d;
padding:9px 13px;
border-radius:10px;
text-align:left;
font-weight:bold;
font-size:14px
}

/* CONTROLS */
#controls{
position:absolute;
bottom:12px;
left:50%;
transform:translateX(-50%);
z-index:60;
display:grid;
grid-template-columns:60px 60px 60px;
gap:6px
}

.ctrl{
width:60px;
height:50px;
border:1px solid #777;
border-radius:12px;
background:#000c;
color:white;
font-size:22px
}

.up{grid-column:2}
.left{grid-column:1}
.down{grid-column:2}
.right{grid-column:3}
</style>
</head>

<body>

<h1>🏙️ GTA MINI CITY</h1>
<p>Explore the city • Drive around • Find the shops</p>

<button id="start">START GAME</button>

<div id="game">

<!-- ROADS -->
<div class="road h1"></div>
<div class="road h2"></div>
<div class="road v1"></div>
<div class="road v2"></div>

<div class="line hline hl1"></div>
<div class="line hline hl2"></div>
<div class="line vline vl1"></div>
<div class="line vline vl2"></div>

<!-- BUILDINGS -->
<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>
<div class="building b5"></div>
<div class="building b6"></div>

<!-- PARK -->
<div id="park">
<div class="tree t1"></div>
<div class="tree t2"></div>
<div class="tree t3"></div>
<div class="tree t4"></div>
</div>

<!-- SHOPS -->
<div class="shop shop1">🏪 SHOP</div>
<div class="shop shop2">🏥 HOSPITAL</div>
<div class="shop shop3">🍔 FOOD</div>

<!-- PETROL -->
<div id="petrol">PETROL</div>

<!-- HUD -->
<div id="hud">
💰 Money: <span id="money">0</span><br>
⭐ Wanted: ☆☆☆☆☆
</div>

<!-- CARS -->
<div class="car red" style="left:35%;top:42%"></div>
<div class="car blue" style="left:58%;top:65%"></div>
<div class="car yellow" style="left:73%;top:25%"></div>
<div class="car green" style="left:15%;top:65%"></div>

<!-- PLAYER -->
<div id="player"></div>

<!-- CONTROLS -->
<div id="controls">
<button class="ctrl up" id="up">⬆️</button>
<button class="ctrl left" id="left">⬅️</button>
<button class="ctrl down" id="down">⬇️</button>
<button class="ctrl right" id="right">➡️</button>
</div>

</div>

<script>

const player=document.getElementById("player");

let x=50;
let y=55;
let playing=false;
let keys={};

function startGame(){

playing=true;
x=50;
y=55;

player.style.left=x+"%";
player.style.top=y+"%";

requestAnimationFrame(gameLoop);
}

function gameLoop(){

if(!playing)return;

let speed=0.55;

if(keys.ArrowUp)y-=speed;
if(keys.ArrowDown)y+=speed;
if(keys.ArrowLeft)x-=speed;
if(keys.ArrowRight)x+=speed;

x=Math.max(2,Math.min(98,x));
y=Math.max(3,Math.min(96,y));

player.style.left=x+"%";
player.style.top=y+"%";

requestAnimationFrame(gameLoop);
}

/* KEYBOARD */
document.addEventListener("keydown",e=>{
keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
keys[e.key]=false;
});

/* MOBILE */
function control(id,key){

const b=document.getElementById(id);

b.addEventListener("touchstart",e=>{
e.preventDefault();
keys[key]=true;
});

b.addEventListener("touchend",e=>{
e.preventDefault();
keys[key]=false;
});

b.addEventListener("mousedown",()=>{
keys[key]=true;
});

b.addEventListener("mouseup",()=>{
keys[key]=false;
});

}

control("up","ArrowUp");
control("down","ArrowDown");
control("left","ArrowLeft");
control("right","ArrowRight");

document.getElementById("start").onclick=startGame;

</script>

</body>
</html>
