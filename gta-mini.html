<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Mini - Farming Edition</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

#game{
  width:100vw;
  height:100vh;
  overflow:hidden;
  position:relative;
  background:#222;
}

#world{
  position:absolute;
  width:2400px;
  height:1800px;
  background:#65a84f;
  transition:transform .08s linear;
}

/* ROADS */
.road{
  position:absolute;
  background:#333;
}

.h1{left:0;top:300px;width:2400px;height:150px;}
.h2{left:0;top:850px;width:2400px;height:150px;}
.h3{left:0;top:1400px;width:2400px;height:150px;}

.v1{left:350px;top:0;width:150px;height:1800px;}
.v2{left:1100px;top:0;width:150px;height:1800px;}
.v3{left:1850px;top:0;width:150px;height:1800px;}

.road:after{
  content:"";
  position:absolute;
  background:repeating-linear-gradient(
    90deg,
    transparent 0 35px,
    #ddd 35px 65px,
    transparent 65px 100px
  );
}

.h1:after,
.h2:after,
.h3:after{
  width:100%;
  height:5px;
  top:72px;
  left:0;
}

.v1:after,
.v2:after,
.v3:after{
  width:5px;
  height:100%;
  left:72px;
  top:0;
  background:repeating-linear-gradient(
    0deg,
    transparent 0 35px,
    #ddd 35px 65px,
    transparent 65px 100px
  );
}

/* BUILDINGS */
.building{
  position:absolute;
  width:230px;
  height:180px;
  background:#b94d3c;
  border:8px solid #703027;
  border-radius:12px;
  box-shadow:8px 8px 0 #263b26;
}

.building:before{
  content:"🏢";
  position:absolute;
  font-size:65px;
  left:75px;
  top:45px;
}

.b1{left:70px;top:60px;}
.b2{left:620px;top:60px;}
.b3{left:1380px;top:60px;}
.b4{left:2050px;top:60px;}

.b5{left:620px;top:560px;}
.b6{left:1380px;top:560px;}
.b7{left:2050px;top:560px;}

.b8{left:70px;top:1110px;}
.b9{left:620px;top:1110px;}
.b10{left:1380px;top:1110px;}
.b11{left:2050px;top:1110px;}

.b12{left:620px;top:1600px;}

/* PARKS */
.park{
  position:absolute;
  width:260px;
  height:210px;
  background:#3e8d43;
  border:8px solid #28632e;
  border-radius:25px;
}

.p1{left:155px;top:570px;}
.p2{left:1570px;top:570px;}

.tree{
  position:absolute;
  font-size:42px;
}

/* SHOPS */
.shop{
  position:absolute;
  width:190px;
  height:120px;
  background:#f0a42b;
  border:7px solid #9b5b12;
  border-radius:15px;
  text-align:center;
  padding-top:35px;
  font-size:22px;
  font-weight:bold;
}

.shop1{left:500px;top:1100px;}
.shop2{left:1250px;top:1100px;}
.shop3{left:1970px;top:850px;}
.shop4{left:60px;top:850px;}

/* PETROL */
.petrol{
  position:absolute;
  left:1550px;
  top:1120px;
  width:240px;
  height:170px;
  background:#e8e8e8;
  border:8px solid #555;
  border-radius:15px;
  text-align:center;
  padding-top:55px;
  font-size:25px;
  font-weight:bold;
}

/* CARS */
.car{
  position:absolute;
  font-size:55px;
}

.car1{left:550px;top:340px;}
.car2{left:800px;top:900px;}
.car3{left:1450px;top:900px;}
.car4{left:1700px;top:340px;}
.car5{left:2000px;top:900px;}
.car6{left:800px;top:1450px;}
.car7{left:1450px;top:1450px;}
.car8{left:2000px;top:1450px;}

/* FARM */
.farm{
  position:absolute;
  left:70px;
  top:1550px;
  width:480px;
  height:220px;
  background:#6b4b2a;
  border:8px solid #3b2918;
  border-radius:20px;
  padding:15px;
}

.farm-title{
  color:white;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  margin-bottom:10px;
}

.field{
  position:absolute;
  background:#8b5a2b;
  border:4px solid #4d321b;
  border-radius:10px;
}

.field1{
  width:180px;
  height:70px;
  left:15px;
  top:55px;
}

.field2{
  width:180px;
  height:70px;
  left:210px;
  top:55px;
}

.field3{
  width:375px;
  height:70px;
  left:15px;
  bottom:12px;
}

.field::after{
  content:"🌱 🌱 🌱";
  position:absolute;
  font-size:20px;
  left:20px;
  top:18px;
}

.barn{
  position:absolute;
  right:20px;
  bottom:145px;
  font-size:45px;
}

.tractor{
  position:absolute;
  right:20px;
  bottom:5px;
  font-size:45px;
}

/* PLAYER */
#player{
  position:absolute;
  width:55px;
  height:65px;
  font-size:48px;
  z-index:20;
  transform:translate(-50%,-50%);
}

/* HUD */
#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:100;
  background:rgba(0,0,0,.75);
  color:white;
  padding:14px 18px;
  border-radius:14px;
  font-size:17px;
  line-height:1.6;
}

#mission{
  position:fixed;
  top:15px;
  right:15px;
  z-index:100;
  background:rgba(0,0,0,.75);
  color:white;
  padding:12px 18px;
  border-radius:14px;
}

/* FARM BUTTONS */
#farmControls{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:200;
  display:flex;
  gap:10px;
}

.farmBtn{
  border:0;
  padding:14px 18px;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
  color:white;
  background:#249b45;
  box-shadow:0 4px 10px #0006;
}

#waterBtn{
  background:#2186d0;
}

#harvestBtn{
  background:#c68a18;
}

/* MOBILE CONTROLS */
#controls{
  position:fixed;
  bottom:20px;
  left:20px;
  z-index:200;
  width:150px;
  height:150px;
}

.ctrl{
  position:absolute;
  width:48px;
  height:48px;
  border:0;
  border-radius:12px;
  background:#ffffffcc;
  font-size:24px;
  font-weight:bold;
}

.up{left:51px;top:0;}
.down{left:51px;bottom:0;}
.left{left:0;top:51px;}
.right{right:0;top:51px;}

@media(max-width:600px){
  #hud{
    font-size:13px;
    padding:8px 10px;
  }

  #mission{
    font-size:13px;
    padding:8px 10px;
  }

  #farmControls{
    right:10px;
    bottom:10px;
    flex-direction:column;
  }

  .farmBtn{
    padding:10px 14px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="world">

    <!-- ROADS -->
    <div class="road h1"></div>
    <div class="road h2"></div>
    <div class="road h3"></div>

    <div class="road v1"></div>
    <div class="road v2"></div>
    <div class="road v3"></div>

    <!-- BUILDINGS -->
    <div class="building b1"></div>
    <div class="building b2"></div>
    <div class="building b3"></div>
    <div class="building b4"></div>
    <div class="building b5"></div>
    <div class="building b6"></div>
    <div class="building b7"></div>
    <div class="building b8"></div>
    <div class="building b9"></div>
    <div class="building b10"></div>
    <div class="building b11"></div>
    <div class="building b12"></div>

    <!-- PARKS -->
    <div class="park p1">
      <span class="tree" style="left:30px;top:30px">🌳</span>
      <span class="tree" style="left:150px;top:20px">🌳</span>
      <span class="tree" style="left:90px;top:110px">🌳</span>
    </div>

    <div class="park p2">
      <span class="tree" style="left:30px;top:30px">🌳</span>
      <span class="tree" style="left:150px;top:20px">🌳</span>
      <span class="tree" style="left:90px;top:110px">🌳</span>
    </div>

    <!-- SHOPS -->
    <div class="shop shop1">🏪 SHOP</div>
    <div class="shop shop2">🍔 FOOD</div>
    <div class="shop shop3">🔧 GARAGE</div>
    <div class="shop shop4">🏥 HOSPITAL</div>

    <!-- PETROL -->
    <div class="petrol">⛽ PETROL</div>

    <!-- CARS -->
    <div class="car car1">🚗</div>
    <div class="car car2">🚕</div>
    <div class="car car3">🚙</div>
    <div class="car car4">🚓</div>
    <div class="car car5">🚗</div>
    <div class="car car6">🚕</div>
    <div class="car car7">🚙</div>
    <div class="car car8">🚓</div>

    <!-- FARM -->
    <div class="farm">

      <div class="farm-title" id="farmTitle">
        🌾 FARM | Seeds: 10 | Crops: 0
      </div>

      <div class="field field1"></div>
      <div class="field field2"></div>
      <div class="field field3"></div>

      <div class="barn">🏠</div>
      <div class="tractor">🚜</div>

    </div>

    <!-- PLAYER -->
    <div id="player">🧑</div>

  </div>

</div>

<!-- HUD -->
<div id="hud">
  💰 Money: ₹<span id="money">100</span><br>
  🌱 Seeds: <span id="seeds">10</span><br>
  🌾 Crops: <span id="crops">0</span>
</div>

<div id="mission">
  🎯 Mission: Explore the city
</div>

<!-- FARM BUTTONS -->
<div id="farmControls">
  <button class="farmBtn" onclick="plantCrop()">🌱 PLANT</button>
  <button class="farmBtn" id="waterBtn" onclick="waterCrop()">💧 WATER</button>
  <button class="farmBtn" id="harvestBtn" onclick="harvestCrop()">🌾 HARVEST</button>
</div>

<!-- MOBILE CONTROLS -->
<div id="controls">

  <button class="ctrl up" onclick="move(0,-1)">⬆️</button>
  <button class="ctrl down" onclick="move(0,1)">⬇️</button>
  <button class="ctrl left" onclick="move(-1,0)">⬅️</button>
  <button class="ctrl right" onclick="move(1,0)">➡️</button>

</div>

<script>

/* =========================
   PLAYER MOVEMENT
========================= */

const player = document.getElementById("player");
const world = document.getElementById("world");

let playerX = 1200;
let playerY = 750;

const speed = 7;

let keys = {};

document.addEventListener("keydown", function(e){
  keys[e.key] = true;
});

document.addEventListener("keyup", function(e){
  keys[e.key] = false;
});

function move(dx,dy){
  playerX += dx * speed * 4;
  playerY += dy * speed * 4;

  limitPlayer();
  updateGame();
}

function limitPlayer(){
  playerX = Math.max(30, Math.min(2370, playerX));
  playerY = Math.max(30, Math.min(1770, playerY));
}

function updateGame(){

  player.style.left = playerX + "px";
  player.style.top = playerY + "px";

  let cameraX = window.innerWidth / 2 - playerX;
  let cameraY = window.innerHeight / 2 - playerY;

  cameraX = Math.min(0, Math.max(window.innerWidth - 2400, cameraX));
  cameraY = Math.min(0, Math.max(window.innerHeight - 1800, cameraY));

  world.style.transform =
    `translate(${cameraX}px,${cameraY}px)`;
}

function gameLoop(){

  if(keys["ArrowUp"] || keys["w"]){
    playerY -= speed;
  }

  if(keys["ArrowDown"] || keys["s"]){
    playerY += speed;
  }

  if(keys["ArrowLeft"] || keys["a"]){
    playerX -= speed;
  }

  if(keys["ArrowRight"] || keys["d"]){
    playerX += speed;
  }

  limitPlayer();
  updateGame();

  requestAnimationFrame(gameLoop);
}

updateGame();
gameLoop();


/* =========================
   FARMING SYSTEM
========================= */

let seeds = 10;
let crops = 0;
let watered = false;
let money = 100;

const seedDisplay = document.getElementById("seeds");
const cropDisplay = document.getElementById("crops");
const moneyDisplay = document.getElementById("money");
const farmTitle = document.getElementById("farmTitle");

function updateFarm(){

  seedDisplay.innerText = seeds;
  cropDisplay.innerText = crops;
  moneyDisplay.innerText = money;

  farmTitle.innerText =
    `🌾 FARM | Seeds: ${seeds} | Crops: ${crops}`;
}


/* PLANT */

function plantCrop(){

  if(seeds <= 0){
    alert("❌ Seeds khatam ho gaye!");
    return;
  }

  seeds--;
  crops++;

  watered = false;

  document.getElementById("mission").innerText =
    "🌱 Crop planted! Now water it 💧";

  updateFarm();
}


/* WATER */

function waterCrop(){

  if(crops <= 0){
    alert("🌱 Pehla crop plant karo!");
    return;
  }

  watered = true;

  document.getElementById("mission").innerText =
    "💧 Crop watered! Harvest it 🌾";

  alert("💧 Crop nu paani mil gaya!");
}


/* HARVEST */

function harvestCrop(){

  if(crops <= 0){
    alert("❌ Harvest karan layi crop nahi hai!");
    return;
  }

  if(!watered){
    alert("💧 Pehla crop nu water karo!");
    return;
  }

  crops--;

  let reward = 25;

  money += reward;

  document.getElementById("mission").innerText =
    `💰 Crop sold! +₹${reward}`;

  alert(`🌾 Harvest successful!\n💰 You earned ₹${reward}`);

  updateFarm();
}


/* =========================
   TOUCH HOLD CONTROLS
========================= */

let interval;

function startMove(dx,dy){

  clearInterval(interval);

  interval = setInterval(function(){

    playerX += dx * speed;
    playerY += dy * speed;

    limitPlayer();
    updateGame();

  },30);
}

function stopMove(){
  clearInterval(interval);
}


/* DESKTOP + MOBILE */

document.querySelector(".up").addEventListener(
  "touchstart",
  ()=>startMove(0,-1)
);

document.querySelector(".down").addEventListener(
  "touchstart",
  ()=>startMove(0,1)
);

document.querySelector(".left").addEventListener(
  "touchstart",
  ()=>startMove(-1,0)
);

document.querySelector(".right").addEventListener(
  "touchstart",
  ()=>startMove(1,0)
);

document.querySelectorAll(".ctrl").forEach(btn => {

  btn.addEventListener("touchend",stopMove);
  btn.addEventListener("mouseup",stopMove);

});


/* =========================
   RESIZE
========================= */

window.addEventListener("resize",updateGame);

</script>

</body>
</html>
