<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Cyber Runner</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
background:#050510;
color:white;
font-family:Arial,sans-serif;
text-align:center;
overflow:hidden
}

h1{
margin:18px 0 4px;
font-size:30px;
letter-spacing:2px
}

p{
margin:0 0 12px;
color:#9ca3af
}

#start,#restart{
border:0;
border-radius:25px;
padding:12px 28px;
font-size:17px;
font-weight:bold;
background:#7c3aed;
color:white;
margin:10px
}

#game{
position:relative;
width:min(96vw,600px);
height:620px;
margin:auto;
overflow:hidden;
border:2px solid #6d28d9;
border-radius:24px;
background:
linear-gradient(#080014,#16002d 45%,#050510);
box-shadow:0 0 35px #7c3aed55
}

/* CITY */
#city{
position:absolute;
bottom:0;
width:100%;
height:38%;
background:
linear-gradient(90deg,
#111827 8%,transparent 8%,
transparent 17%,#1f2937 17%,
#1f2937 29%,transparent 29%,
transparent 40%,#111827 40%,
#111827 54%,transparent 54%,
transparent 65%,#1f2937 65%,
#1f2937 82%,transparent 82%);
opacity:.9
}

/* ROAD */
#road{
position:absolute;
bottom:0;
left:5%;
width:90%;
height:58%;
background:#151922;
border-left:4px solid #a855f7;
border-right:4px solid #22d3ee;
transform:perspective(400px) rotateX(8deg)
}

/* ROAD LINES */
#road:before{
content:"";
position:absolute;
left:50%;
top:-20px;
width:6px;
height:110%;
transform:translateX(-50%);
background:repeating-linear-gradient(
to bottom,
#ffffff 0px,
#ffffff 55px,
transparent 55px,
transparent 105px
);
opacity:.65
}

/* ================= CAR ================= */

.car{
position:absolute;
width:52px;
height:82px;
border-radius:16px 16px 10px 10px;
z-index:10;
box-shadow:0 0 20px #00eaff;
}

/* windshield */
.car:before{
content:"";
position:absolute;
top:12px;
left:8px;
width:36px;
height:25px;
border-radius:9px 9px 5px 5px;
background:linear-gradient(
135deg,
#dffaff,
#3b82f6 55%,
#111827
);
border:2px solid #94a3b8
}

/* bumper */
.car:after{
content:"";
position:absolute;
bottom:8px;
left:6px;
width:40px;
height:9px;
border-radius:5px;
background:#111827;
box-shadow:
0 0 8px #ef4444,
inset 0 0 4px #475569
}

/* WHEELS */
.wheel{
position:absolute;
width:9px;
height:22px;
background:#050505;
border-radius:5px;
top:30px;
z-index:-1;
box-shadow:inset 0 0 3px #777
}

.wheel.left{
left:-7px
}

.wheel.right{
right:-7px
}

/* HEADLIGHTS */
.light{
position:absolute;
width:9px;
height:6px;
background:#fff;
border-radius:4px;
top:5px;
box-shadow:0 0 12px #fff
}

.light.left{
left:7px
}

.light.right{
right:7px
}

/* PLAYER CAR */
#player{
bottom:55px;
left:calc(50% - 26px);
background:linear-gradient(
90deg,
#06b6d4,
#2563eb,
#1d4ed8
);
border:2px solid #67e8f9
}

#player .light{
background:#e0f2fe
}

/* ENEMY CAR */
.enemy{
background:linear-gradient(
90deg,
#ef4444,
#991b1b,
#450a0a
);
border:2px solid #fb7185;
box-shadow:0 0 20px #ef4444;
}

.enemy .light{
background:#fecaca;
box-shadow:0 0 10px #fecaca
}

/* COIN */
.coin{
position:absolute;
width:28px;
height:28px;
border:4px solid #facc15;
border-radius:50%;
box-shadow:0 0 18px #facc15;
z-index:8
}

/* SCORE */
#score{
position:absolute;
top:14px;
left:14px;
z-index:20;
padding:9px 14px;
border-radius:14px;
background:#000b;
font-weight:bold;
font-size:18px
}

/* CONTROLS */
#controls{
position:absolute;
bottom:15px;
width:100%;
z-index:30;
display:flex;
justify-content:space-between;
padding:0 18px
}

.control{
width:75px;
height:55px;
border:1px solid #ffffff44;
border-radius:18px;
background:#000b;
color:white;
font-size:27px
}

/* GAME OVER */
#over{
display:none;
position:absolute;
inset:0;
z-index:50;
background:#050510ee;
align-items:center;
justify-content:center;
flex-direction:column
}

#over h2{
font-size:38px;
margin:5px
}

#final{
font-size:21px;
margin:10px
}
</style>
</head>

<body>

<h1>⚡ NEON CYBER RUNNER</h1>
<p>Collect coins. Dodge cars. Beat your high score!</p>

<button id="start">START RUN</button>

<div id="game">

<div id="city"></div>
<div id="road"></div>

<div id="score">⭐ 0</div>

<!-- PLAYER CAR -->
<div id="player" class="car">
<div class="wheel left"></div>
<div class="wheel right"></div>
<div class="light left"></div>
<div class="light right"></div>
</div>

<div id="controls">
<button class="control" id="left">⬅️</button>
<button class="control" id="right">➡️</button>
</div>

<div id="over">
<h2>GAME OVER</h2>
<div id="final">Your Score: 0</div>
<button id="restart">RESTART</button>
</div>

</div>

<script>

const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreBox=document.getElementById("score");

let x=50;
let score=0;
let playing=false;
let speed=4;
let spawn;

function start(){

document.querySelectorAll(".coin,.enemy").forEach(e=>e.remove());

x=50;
score=0;
speed=4;
playing=true;

player.style.left="calc(50% - 26px)";
scoreBox.textContent="⭐ 0";

document.getElementById("over").style.display="none";

clearInterval(spawn);
spawn=setInterval(createObject,700);

}

function move(dir){

if(!playing)return;

x+=dir*8;

if(x<20)x=20;
if(x>80)x=80;

player.style.left="calc("+x+"% - 26px)";

}

function createObject(){

if(!playing)return;

const isCoin=Math.random()<0.5;

if(isCoin){

const coin=document.createElement("div");

coin.className="coin";

const lanes=[25,50,75];
const lane=lanes[Math.floor(Math.random()*lanes.length)];

coin.style.left="calc("+lane+"% - 14px)";
coin.style.top="-40px";

game.appendChild(coin);

fallObject(coin,true);

}else{

const car=document.createElement("div");

car.className="enemy car";

car.innerHTML=`
<div class="wheel left"></div>
<div class="wheel right"></div>
<div class="light left"></div>
<div class="light right"></div>
`;

const lanes=[25,50,75];
const lane=lanes[Math.floor(Math.random()*lanes.length)];

car.style.left="calc("+lane+"% - 26px)";
car.style.top="-90px";

game.appendChild(car);

fallObject(car,false);

}

}

function fallObject(obj,isCoin){

let y=-90;

const fall=setInterval(()=>{

if(!playing){

clearInterval(fall);
obj.remove();
return;

}

y+=speed;
obj.style.top=y+"px";

const a=player.getBoundingClientRect();
const b=obj.getBoundingClientRect();

if(
a.left<b.right &&
a.right>b.left &&
a.top<b.bottom &&
a.bottom>b.top
){

clearInterval(fall);

if(isCoin){

score++;

scoreBox.textContent="⭐ "+score;

obj.remove();

if(score%5===0){
speed+=0.5;
}

}else{

obj.remove();
gameOver();

}

}

if(y>650){

clearInterval(fall);
obj.remove();

}

},30);

}

function gameOver(){

playing=false;

clearInterval(spawn);

document.getElementById("final").textContent=
"Your Score: "+score;

document.getElementById("over").style.display="flex";

}

document.getElementById("start").onclick=start;

document.getElementById("restart").onclick=start;

document.getElementById("left").onclick=()=>move(-1);

document.getElementById("right").onclick=()=>move(1);

document.addEventListener("keydown",e=>{

if(e.key==="ArrowLeft")move(-1);

if(e.key==="ArrowRight")move(1);

});

</script>

</body>
</html>
